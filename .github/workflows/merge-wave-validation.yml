name: Pinned findings runtime retry validation
on:
  push:
    branches: [validation/merge-wave-20261007]
    paths: [.github/workflows/merge-wave-validation.yml]
permissions:
  contents: read
  actions: read
env:
  BASE_SHA: 07429cf69631f1d3e560b3fee412c7036db3fcf3
  HEAD_SHA: d828285c6bd0035d69c6cb723517b2eedfd14807
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d828285c6bd0035d69c6cb723517b2eedfd14807
          fetch-depth: 0
          persist-credentials: false
      - name: Construct pinned current-base candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff "$BASE_SHA"
          git diff --cached --check
          git write-tree
      - uses: ./.github/actions/setup-tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install pinned dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Obtain the verified native payload for unchanged pinned sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code "$BASE_SHA" -- plugins/codex-security/native
          gh run download 37606912953 --repo openai/codex-security --name native-universal-07429cf69631f1d3e560b3fee412c7036db3fcf3 --dir plugins/codex-security/native/prebuilt
          test -f plugins/codex-security/native/prebuilt/COPYRIGHT-library.html
          echo 'Native payload comes from successful upstream main run 37606912953 at the exact pinned base.'
      - name: Build the real bundled plugin
        run: pnpm --dir sdk/typescript run build:plugin
      - name: Validate the retry lifecycle on the real runtime
        working-directory: sdk/typescript
        env:
          PYTHON: /usr/bin/python3
        run: bun test --timeout 30000 tests-ts/findings-store-retry.test.ts
      - name: Typecheck and format the modified files
        working-directory: sdk/typescript
        run: |
          pnpm run types
          pnpm exec prettier --check src/server/sqlite-store.ts tests-ts/findings-store-retry.test.ts
  preserve_candidate:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d828285c6bd0035d69c6cb723517b2eedfd14807
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the already-tested source without executing it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff "$BASE_SHA"
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'Merge current main after runtime retry validation'
      - name: Publish only a candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate=validation/merge-wave-20261007-pr-1334
          gh auth setup-git
          test -z "$(git ls-remote --heads origin "$candidate")"
          git push origin "HEAD:refs/heads/$candidate"
          echo "VALIDATED_CANDIDATE $candidate $(git rev-parse HEAD)"
